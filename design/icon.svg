<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E6"/>
      <stop offset="1" stop-color="#F2E9D9"/>
    </linearGradient>

    <!-- 月牙遮罩：外圆保留，偏移内圆挖空 -->
    <mask id="crescent">
      <rect x="0" y="0" width="512" height="512" fill="#000"/>
      <circle cx="256" cy="256" r="130" fill="#fff"/>
      <circle cx="310" cy="228" r="122" fill="#000"/>
    </mask>
  </defs>

  <!-- 纸感底色与细描边 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#paper)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="#E8DCC7" stroke-width="3"/>

  <!-- 轨道环 -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="184" ry="69" fill="none" stroke="#0FA8A0" stroke-width="13"/>
  </g>

  <!-- 月牙 -->
  <circle cx="256" cy="256" r="130" fill="#1C2B3A" mask="url(#crescent)"/>

  <!-- 轨道节点 -->
  <circle cx="96" cy="300" r="7" fill="#0FA8A0"/>
  <circle cx="404" cy="214" r="7" fill="#0FA8A0"/>
</svg>
