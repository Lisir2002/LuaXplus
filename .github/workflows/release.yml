name: Build release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build Lua 5.5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o "$RUNNER_TEMP/lua-5.5.1.tar.gz"
          tar -xzf "$RUNNER_TEMP/lua-5.5.1.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.5.1" linux -j"$(nproc)"
          "$RUNNER_TEMP/lua-5.5.1/src/lua" -v

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINI_LUAXPLUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 MINI_LUAXPLUS_KEYSTORE_BASE64，无法生成正式签名包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mini-luaxplus-release.jks"
          test -s "$RUNNER_TEMP/mini-luaxplus-release.jks"

      - name: Build release APK
        env:
          LUA_BIN: ${{ runner.temp }}/lua-5.5.1/src/lua
          MINI_LUAXPLUS_KEYSTORE: ${{ runner.temp }}/mini-luaxplus-release.jks
          MINI_LUAXPLUS_KEYSTORE_PASSWORD: ${{ secrets.MINI_LUAXPLUS_KEYSTORE_PASSWORD }}
          MINI_LUAXPLUS_KEY_ALIAS: ${{ secrets.MINI_LUAXPLUS_KEY_ALIAS }}
          MINI_LUAXPLUS_KEY_PASSWORD: ${{ secrets.MINI_LUAXPLUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and name APK
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          VERSION_NAME=$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          test -n "$VERSION_NAME"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION_NAME" || {
              echo "::error::Tag ${GITHUB_REF_NAME} 与 versionName ${VERSION_NAME} 不一致"
              exit 1
            }
          fi
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::APK 包含非 arm64 原生库"
            exit 1
          fi
          unzip -p "$APK" lib/arm64-v8a/libluajava.so > "$RUNNER_TEMP/libluajava.so"
          strings "$RUNNER_TEMP/libluajava.so" | grep -q 'Lua 5.5.1' || {
            echo "::error::APK 内的 libluajava.so 不是 Lua 5.5.1"
            exit 1
          }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUTPUT="Mini-LuaXPLUS-${VERSION_NAME}.apk"
          cp "$APK" "$OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUTPUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mini-LuaXPLUS-${{ steps.apk.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
