plugins {
    id 'com.android.library'
}

android {
    namespace 'com.androlua'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // noinspection ChromeOsAbiSupport
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // noinspection ChromeOsAbiSupport
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            // 基础 Lua 库同样需要作为 assets 提供给运行时
            assets.srcDirs += ['src/main/resources']
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api libs.androidx.appcompat.appcompat
    api libs.google.material
}

// 手动入口：生成 Lua 5.5 原生库，产物在 build/native/<abi>，不参与默认 assemble
tasks.register('buildLua55Native', Exec) {
    group = 'native'
    description = 'Build Lua 5.5.1 runtime and native modules for arm64-v8a'
    workingDir rootProject.projectDir
    commandLine 'bash', 'tools/native/build.sh'
}
